# 通过 Render Deploy Hook 自动部署
# 前置：在 Render 服务页复制 Deploy Hook URL，并设为仓库 Secret：RENDER_DEPLOY_HOOK

name: Deploy to Render

on:
  push:
    branches: [ master ]      # 你的默认分支是 master
  workflow_dispatch:          # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate hooks secrets
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not configured."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deploy hook..."
          curl -sSf -X POST "$RENDER_DEPLOY_HOOK" \
            -H "Accept: application/json" \
            | jq -r '.message // empty' || true